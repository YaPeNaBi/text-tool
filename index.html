<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Writer</title>
    <script>
      // The theme before the first paint (B-UI-18), so a page kept dark never
      // flashes light while the app loads. Light is the default and needs
      // nothing. The key is the web platform's THEME_KEY.
      try {
        if (localStorage.getItem('ascii-writer:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
