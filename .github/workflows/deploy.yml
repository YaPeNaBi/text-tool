# Checks every push, and publishes main to char.tools.
#
# One job proves the build — types, lint, unit tests, then the e2e suite in a
# real Chromium — and only a push to main that got through all of it is handed
# to the second job, which puts dist/ on GitHub Pages. A broken main therefore
# leaves the site as it was rather than replacing it.
#
# Pull requests run the first job only: the checks without the publishing.

name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - run: npm run check

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Two pushes in quick succession publish in order; neither is cut off halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
