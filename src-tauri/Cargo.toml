[package]
name = "ascii-writer"
version = "0.1.0"
description = "A diagram editor whose document is plain text"
edition = "2021"
# Tauri 2's own floor is 1.77.2, but a transitive dependency needs edition 2024.
rust-version = "1.85"

[lib]
name = "ascii_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
